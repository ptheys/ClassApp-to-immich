[supervisord]
nodaemon=true
user=root

[program:xvfb]
command=Xvfb :99 -screen 0 1280x800x24
autorestart=true
priority=10

[program:x11vnc]
command=x11vnc -display :99 -forever -shared -nopw -rfbport 5900
autorestart=true
priority=20
startsecs=2

[program:novnc]
command=websockify --web=/usr/share/novnc 6080 localhost:5900
autorestart=true
priority=30
startsecs=2
